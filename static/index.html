<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle AI Expert - Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🚀</span>
                    <h1 class="logo-3d">Pinnacle AI<br><span class="subtitle">Expert Systems</span></h1>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="quick-actions">
                    <button id="new-chat-btn" class="quick-action-btn"
                        style="background: var(--accent); color: white; width: 100%; justify-content: center;">
                        ✨ New Chat
                    </button>
                    <!-- HD Toggle (Groq Whisper vs Browser STT) -->
                    <button id="hd-toggle-btn" class="quick-action-btn"
                        title="Toggle High-Quality Audio (Groq Whisper)">
                        STD
                    </button>
                </div>

                <div class="section-title" style="margin-top: 24px;">History</div>
                <div id="history-list" class="history-list">
                    <!-- History populated by JS -->
                    <div class="loader-small"></div>
                </div>
            </div>

            <div class="sidebar-footer">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-chat">
            <header class="chat-header">
                <div class="header-title">
                    <span class="header-text">Pinnacle AI Expert Chat</span>
                </div>
                <div class="header-controls" style="display: flex; align-items: center; gap: 10px;">
                    <button id="voice-mode-btn" class="voice-mode-button" title="Activate Premium Voice Mode">
                        <span class="voice-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                <line x1="12" y1="19" x2="12" y2="23" />
                                <line x1="8" y1="23" x2="16" y2="23" />
                            </svg>
                        </span>
                        <span class="voice-text">Voice Mode</span>
                        <span class="voice-pulse"></span>
                    </button>
                    <label class="toggle-switch" title="Auto-Speak Responses">
                        <input type="checkbox" id="auto-speak-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
            </header>

            <!-- Brand Banner -->
            <div class="brand-banner" style="
                text-align: center;
                padding: 12px 20px;
                background: linear-gradient(135deg, rgba(0, 243, 255, 0.05), rgba(0, 122, 255, 0.05));
                border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            ">
                <h2 style="
                    margin: 0;
                    font-family: 'Outfit', sans-serif;
                    font-size: clamp(1rem, 3vw, 1.4rem);
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 2px;
                    background: linear-gradient(135deg, #00F3FF 0%, #007AFF 100%);
                    -webkit-background-clip: text;
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                ">PINNACLE AI SOLUTIONS</h2>
            </div>

            <div id="chat-messages" class="chat-messages">
                <div class="message assistant-message first">
                    <div class="message-content">
                        <strong>🚀 Pinnacle AI Expert Systems</strong><br><br>
                        Welcome! I'm here to help you architect <strong>Elite AI Agents</strong>,
                        <strong>Stealthy Scrapers</strong>, and <strong>Scalable Web Applications</strong>.<br><br>
                        <em>Ready to transform your business with AI? Let's discuss your project!</em>
                    </div>
                </div>
            </div>

            <div id="voice-visualizer" class="voice-visualizer hidden">
                <div class="v-bar"></div>
                <div class="v-bar"></div>
                <div class="v-bar"></div>
                <div class="v-bar"></div>
                <div class="v-bar"></div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <div class="input-row">
                        <textarea id="user-input" placeholder="Discuss your AI project..." rows="1"></textarea>
                        <button id="mic-btn" class="mic-button" title="Speak to type">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                <line x1="12" y1="19" x2="12" y2="23" />
                                <line x1="8" y1="23" x2="16" y2="23" />
                            </svg>
                        </button>
                        <button id="send-btn" class="send-button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Background Decoration -->
    <div class="bg-blur blur-1"></div>
    <div class="bg-blur blur-2"></div>

    <script src="/static/config.js"></script>
    <script src="/static/chat.js?v=2.0.0"></script>
</body>

</html>
